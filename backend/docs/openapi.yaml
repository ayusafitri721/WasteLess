    FoodListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FoodListing'
            pagination:
              $ref: '#/components/schemas/Pagination'
    ReservationStatus:
