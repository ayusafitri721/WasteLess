        receiverId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserSummary'
        quantity:
          type: number
        status:
          $ref: '#/components/schemas/ReservationStatus'
        pickupSchedule:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        statusNote:
          type: string
          nullable: true
        statusChangedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReservationSummary:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/ReservationStatus'
        quantity:
          type: number
        pickupSchedule:
