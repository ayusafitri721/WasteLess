          minimum: 0
          maximum: 100000
        pickupSchedule:
          type: string
          format: date-time
          description: Opsional; harus setelah sekarang dan tidak melewati pickupDeadline listing
    ApproveReservationRequest:
      type: object
      additionalProperties: false
      properties:
        pickupSchedule:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 500
    RejectReservationRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    CancelReservationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ReservationResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            reservation:
              $ref: '#/components/schemas/Reservation'
    ReservationListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Reservation'
            pagination:
              $ref: '#/components/schemas/Pagination'
    DistributionStatus:
      type: string
      enum: [pending, pickup_ready, verified, completed, failed]
    Distribution:
      type: object
      properties:
        id:
          type: string
        reservationId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ReservationSummary'
        listingId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/FoodSummary'
        providerId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserSummary'
        receiverId:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserSummary'
        quantity:
          type: number
        unit:
          $ref: '#/components/schemas/FoodUnit'
        status:
          $ref: '#/components/schemas/DistributionStatus'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VerifyPickupRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: Kode pengambilan 6 digit
    DistributionResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            distribution:
              $ref: '#/components/schemas/Distribution'
    DistributionListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Distribution'
            pagination:
              $ref: '#/components/schemas/Pagination'
    ReadyForPickupResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            reservation:
              $ref: '#/components/schemas/Reservation'
            distribution:
              $ref: '#/components/schemas/Distribution'
            pickupCode:
              type: string
              pattern: '^\d{6}$'
              description: Ditampilkan satu kali; simpan dan berikan kepada receiver
    FoodStatusBreakdown:
      type: object
      description: Jumlah listing per status
      required: [draft, available, reserved, completed, expired, cancelled]
      properties:
        draft:
          type: integer
        available:
          type: integer
        reserved:
          type: integer
        completed:
          type: integer
        expired:
          type: integer
        cancelled:
          type: integer
    ReservationStatusBreakdown:
      type: object
      description: Jumlah reservasi per status
      required:
        - pending
        - approved
        - rejected
        - cancelled
        - ready_for_pickup
        - picked_up
        - completed
        - expired
      properties:
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        cancelled:
          type: integer
        ready_for_pickup:
          type: integer
        picked_up:
          type: integer
        completed:
          type: integer
        expired:
          type: integer
